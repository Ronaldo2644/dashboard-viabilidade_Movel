<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Estudo de Viabilidade</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
        }

        /* ===== APP CONTAINER ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            max-width: 100%;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            background: #1a1f2a;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #2d3340;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .top-bar .brand {
            font-weight: 700;
            font-size: 18px;
            color: #e8edf5;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 12px;
        }
        .top-bar .brand small {
            font-weight: 400;
            font-size: 13px;
            color: #8892a5;
        }
        .top-bar .upload-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f131b;
            padding: 4px 12px 4px 8px;
            border-radius: 8px;
            border: 1px dashed #3a4050;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            white-space: nowrap;
            color: #cbd5e1;
        }
        .top-bar .upload-area:hover {
            border-color: #4a6a9a;
            background: #161c28;
        }
        .top-bar .upload-area input[type="file"] {
            display: none;
        }
        .top-bar .upload-area .icon {
            color: #4a8fc4;
            font-size: 18px;
        }
        .top-bar .upload-area .file-info {
            font-size: 11px;
            color: #4aae7a;
            font-weight: 500;
            margin-left: 4px;
        }
        .top-bar .search-group {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .top-bar .search-group .field {
            flex: 1 1 160px;
            min-width: 120px;
        }
        .top-bar .search-group label {
            font-size: 10px;
            font-weight: 600;
            color: #8892a5;
            display: block;
            margin-bottom: 1px;
        }
        .top-bar .search-group input,
        .top-bar .search-group textarea {
            width: 100%;
            padding: 4px 8px;
            border: 1.5px solid #2d3340;
            border-radius: 6px;
            font-size: 12px;
            background: #0f131b;
            color: #e8edf5;
            font-family: inherit;
        }
        .top-bar .search-group textarea {
            resize: vertical;
            min-height: 32px;
        }
        .top-bar .search-group input:focus,
        .top-bar .search-group textarea:focus {
            outline: none;
            border-color: #4a8fc4;
            box-shadow: 0 0 0 3px rgba(74, 143, 196, 0.2);
        }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a3a5a;
            color: #e8edf5;
            border: none;
            padding: 5px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #3a4e72;
        }
        .btn-outline {
            background: transparent;
            color: #8892a5;
            border: 2px solid #3a4050;
        }
        .btn-outline:hover {
            background: #1a1f2a;
            color: #e8edf5;
            border-color: #4a8fc4;
        }
        .btn-success {
            background: #1a6a4a;
        }
        .btn-success:hover {
            background: #2a8a5a;
        }
        .btn-sm {
            font-size: 11px;
            padding: 3px 10px;
        }
        .radius-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .radius-group input[type="range"] {
            width: 90px;
            accent-color: #4a8fc4;
        }
        .radius-group .val {
            font-weight: 600;
            font-size: 13px;
            color: #e8edf5;
            min-width: 40px;
        }

        /* ===== FILTROS + INDICADORES ===== */
        .filters-indicators {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            background: #1a1f2a;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #2d3340;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
            align-items: stretch;
        }
        .filters-indicators .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            flex: 1;
        }
        .filtro-box {
            background: #0f131b;
            border-radius: 8px;
            padding: 6px 10px;
            border: 1px solid #2d3340;
            min-width: 140px;
        }
        .filtro-box .label {
            font-size: 10px;
            font-weight: 600;
            color: #8892a5;
            margin-bottom: 2px;
            display: block;
        }
        .filtro-opcoes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .filtro-opcoes label {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            background: #0f131b;
            padding: 0 8px 0 4px;
            border-radius: 16px;
            border: 1px solid #2d3340;
            transition: 0.15s;
            color: #cbd5e1;
        }
        .filtro-opcoes label:hover {
            background: #1a1f2a;
        }
        .filtro-opcoes label input[type="checkbox"] {
            accent-color: #4a8fc4;
            width: 13px;
            height: 13px;
        }
        .filtro-opcoes label.checked {
            background: #1a2a4a;
            border-color: #4a8fc4;
            color: #e8edf5;
        }
        .filtro-botoes {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: 4px;
        }
        .filtro-botoes .badge {
            background: #2d3340;
            color: #8892a5;
            font-size: 10px;
            padding: 0 8px;
            border-radius: 30px;
        }
        .indicadores {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            background: #0f131b;
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid #2d3340;
        }
        .indicador-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            padding: 2px 4px;
        }
        .indicador-item .numero {
            font-size: 18px;
            font-weight: 700;
            color: #e8edf5;
            line-height: 1.2;
        }
        .indicador-item .rotulo {
            font-size: 10px;
            color: #8892a5;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .indicador-item.destaque .numero {
            color: #4a8fc4;
        }
        .indicadores-detalhes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-left: 8px;
        }
        .indicadores-detalhes span {
            background: #1a1f2a;
            padding: 0 8px;
            border-radius: 20px;
            font-size: 10px;
            display: inline-block;
            color: #cbd5e1;
        }
        .indicadores-detalhes span strong {
            color: #e8edf5;
        }

        /* ===== ÁREA PRINCIPAL ===== */
        .main-area {
            display: flex;
            flex: 1;
            gap: 0;
            min-height: 0;
            position: relative;
        }

        /* Painel esquerdo */
        .left-panel {
            flex: 0 0 500px;
            min-width: 300px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            padding-right: 6px;
        }

        .left-panel .card {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #1a1f2a;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #2d3340;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .left-panel .card .card-title {
            flex-shrink: 0;
            color: #e8edf5;
        }
        .left-panel .card .card-body {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .left-panel .card .card-body::-webkit-scrollbar {
            width: 4px;
        }
        .left-panel .card .card-body::-webkit-scrollbar-thumb {
            background: #2d3340;
            border-radius: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #e8edf5;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title .badge {
            background: #2d3340;
            color: #8892a5;
            font-size: 10px;
            padding: 0 8px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* Filtro dentro do card de pontos */
        .filtro-pontos {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f131b;
            border: 1px solid #2d3340;
            border-radius: 6px;
            padding: 2px 8px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .filtro-pontos i {
            color: #5a6a7a;
            font-size: 12px;
        }
        .filtro-pontos input {
            border: none;
            background: transparent;
            padding: 4px 0;
            font-size: 12px;
            width: 100%;
            outline: none;
            font-family: inherit;
            color: #e8edf5;
        }
        .filtro-pontos input::placeholder {
            color: #5a6a7a;
        }

        .pontos-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-content: flex-start;
        }
        .ponto-item {
            background: #0f131b;
            padding: 2px 10px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #2d3340;
            word-break: break-word;
            max-width: 100%;
            line-height: 1.4;
            color: #cbd5e1;
        }
        .ponto-item:hover {
            background: #1a2a3a;
            border-color: #4a6a8a;
        }
        .ponto-item.active {
            background: #1a3a6a;
            color: #fff;
            border-color: #4a8fc4;
        }
        .ponto-item .badge-aprox {
            background: #8a6a1a;
            color: #fff;
            font-size: 8px;
            padding: 0 5px;
            border-radius: 10px;
            margin-left: 4px;
        }

        .table-wrap {
            overflow: auto;
            font-size: 11px;
            border: 1px solid #2d3340;
            border-radius: 8px;
            flex: 1;
            min-height: 0;
            background: #0f131b;
        }
        .table-wrap::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .table-wrap::-webkit-scrollbar-thumb {
            background: #2d3340;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        table th {
            background: #1a1f2a;
            color: #8892a5;
            font-weight: 600;
            padding: 5px 7px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid #2d3340;
        }
        table td {
            padding: 4px 7px;
            border-bottom: 1px solid #2d3340;
            vertical-align: middle;
            color: #cbd5e1;
        }
        table tr:hover td {
            background: #1a1f2a;
        }
        table tr.highlight td {
            background: #1a3a4a;
        }

        .tag {
            display: inline-block;
            background: #2d3340;
            padding: 0 6px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 500;
            margin: 1px 1px;
            color: #cbd5e1;
        }
        .tag-tech {
            background: #1a2a4a;
            color: #7a9ac0;
        }
        .tag-operator {
            background: #2a3a4a;
            color: #9aafc0;
        }
        .tag-operator.tim {
            background: #0055aa;
            color: #fff;
        }
        .tag-operator.vivo {
            background: #6a1a8a;
            color: #fff;
        }
        .tag-operator.claro {
            background: #c06a0a;
            color: #fff;
        }
        .tag-operator.oi {
            background: #1a7a4a;
            color: #fff;
        }
        .dist-badge {
            font-weight: 600;
            color: #cbd5e1;
        }
        .dist-badge.near {
            color: #4aae7a;
        }
        .dist-badge.far {
            color: #c06a5a;
        }

        .empty-state {
            text-align: center;
            padding: 16px 8px;
            color: #5a6a7a;
            font-size: 12px;
        }
        .empty-state .big-icon {
            font-size: 24px;
            margin-bottom: 4px;
            opacity: 0.5;
        }

        /* ===== DIVISOR (RESIZER) ===== */
        .resizer {
            flex: 0 0 6px;
            background: #2d3340;
            cursor: col-resize;
            position: relative;
            transition: background 0.15s;
            border-radius: 4px;
            margin: 0 4px;
            align-self: stretch;
        }
        .resizer:hover,
        .resizer.active {
            background: #4a8fc4;
        }
        .resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 30px;
            background: #3a4050;
            border-radius: 2px;
            box-shadow: -4px 0 0 #3a4050, 4px 0 0 #3a4050;
            transition: background 0.15s;
        }
        .resizer:hover::after,
        .resizer.active::after {
            background: #fff;
            box-shadow: -4px 0 0 #fff, 4px 0 0 #fff;
        }

        /* ===== MAPA ===== */
        .right-panel {
            flex: 1;
            min-width: 0;
            background: #0f131b;
            border-radius: 12px;
            border: 1px solid #2d3340;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .top-bar .search-group {
                flex: 1 1 100%;
            }
            .main-area {
                flex-direction: column;
            }
            .left-panel {
                flex: none !important;
                max-width: 100% !important;
                width: 100% !important;
                min-width: 0 !important;
                max-height: 50vh;
                padding-right: 0;
            }
            .resizer {
                display: none;
            }
            .right-panel {
                height: 50vh;
                flex: none;
            }
            .filters-indicators {
                flex-direction: column;
                gap: 8px;
            }
            .indicadores {
                flex-wrap: wrap;
            }
            .left-panel .card {
                min-height: 120px;
            }
        }
        @media (max-width: 600px) {
            .top-bar .brand {
                font-size: 15px;
            }
            .top-bar .upload-area {
                font-size: 11px;
                padding: 2px 8px;
            }
            .left-panel {
                max-height: 40vh;
            }
            .right-panel {
                height: 40vh;
            }
        }

        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
        }
        .gap-2 {
            gap: 8px;
        }
        .items-center {
            align-items: center;
        }
        .text-muted {
            color: #5a6a7a;
            font-size: 11px;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mb-1 {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <div class="brand">
            📡 Estudo de Viabilidade
            <small>Cobertura móvel</small>
        </div>

        <div class="upload-area" id="uploadZone">
            <span class="icon"><i class="fas fa-file-excel"></i></span>
            <span>Carregar <strong>Pasta1.xlsx</strong></span>
            <input type="file" id="fileInput" accept=".xlsx,.xls" />
            <span class="file-info" id="fileInfo"></span>
        </div>

        <div class="search-group">
            <div class="field">
                <label><i class="fas fa-map-pin"></i> Endereço</label>
                <textarea id="addressInput" placeholder="Rua Lopes Quintas 20, RJ" rows="1"></textarea>
            </div>
            <div class="field">
                <label><i class="fas fa-globe"></i> Coordenadas</label>
                <textarea id="coordInput" placeholder="-28.72917, -54.9075" rows="1"></textarea>
            </div>
            <div class="actions">
                <div class="radius-group">
                    <span style="font-weight:500; font-size:12px;">📏</span>
                    <input type="range" id="radiusSlider" min="0.5" max="20" step="0.5" value="5" />
                    <span class="val" id="radiusLabel">5 km</span>
                </div>
                <button class="btn" id="searchBtn"><i class="fas fa-search"></i> Buscar</button>
                <button class="btn btn-outline" id="clearBtn"><i class="fas fa-undo-alt"></i></button>
                <label class="btn btn-outline btn-sm" id="importLabel" style="cursor:pointer;">
                    <i class="fas fa-upload"></i> Importar
                </label>
                <input type="file" id="importFileInput" accept=".txt,.csv" style="display:none;" />
                <span class="file-status" id="importStatus" style="font-size:10px; color:#4aae7a;"></span>
            </div>
        </div>
    </div>

    <!-- ===== FILTROS + INDICADORES ===== -->
    <div class="filters-indicators">
        <div class="filtros">
            <div class="filtro-box" id="filtroOperadoras">
                <span class="label">Operadora</span>
                <div class="filtro-opcoes" id="opcoesOperadoras"></div>
            </div>
            <div class="filtro-box" id="filtroTecnologias">
                <span class="label">Tecnologia</span>
                <div class="filtro-opcoes" id="opcoesTecnologias"></div>
            </div>
            <div class="filtro-botoes">
                <button class="btn btn-sm btn-outline" id="limparFiltrosBtn"><i class="fas fa-times"></i></button>
                <button class="btn btn-sm" id="aplicarFiltrosBtn"><i class="fas fa-check"></i> Aplicar</button>
                <span class="badge" id="filtroCount" style="background:#2d3340; color:#8892a5; font-size:10px; padding:0 8px; border-radius:30px;">0 ativos</span>
            </div>
        </div>

        <div class="indicadores">
            <div class="indicador-item destaque">
                <span class="numero" id="indTotal">0</span>
                <span class="rotulo">Antenas</span>
            </div>
            <div class="indicador-item">
                <span class="numero" id="indOps">0</span>
                <span class="rotulo">Operadoras</span>
            </div>
            <div class="indicador-item">
                <span class="numero" id="indTecnologias">0</span>
                <span class="rotulo">Tecnologias</span>
            </div>
            <div class="indicador-item">
                <span class="numero" id="indMaisProx">-</span>
                <span class="rotulo">Mais próxima</span>
            </div>
            <div class="indicadores-detalhes" id="indicadoresDetalhes"></div>
        </div>
    </div>

    <!-- ===== ÁREA PRINCIPAL ===== -->
    <div class="main-area">

        <!-- PAINEL ESQUERDO -->
        <div class="left-panel" id="leftPanel">

            <!-- Pontos pesquisados -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-map-marker-alt" style="color:#4a8fc4;"></i> Pontos pesquisados
                    <span class="badge" id="qtdPontos">0</span>
                </div>
                <div class="filtro-pontos">
                    <i class="fas fa-search"></i>
                    <input type="text" id="filtroPontosInput" placeholder="Filtrar pontos..." />
                </div>
                <div class="card-body">
                    <div class="pontos-lista" id="pontosLista"></div>
                </div>
            </div>

            <!-- Antenas no raio -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-table" style="color:#4a8fc4;"></i> Antenas no raio
                    <span class="badge" id="resultCount">0</span>
                    <span style="margin-left:auto;">
                        <button class="btn btn-success btn-sm" id="exportCsvBtn"><i class="fas fa-file-csv"></i> CSV</button>
                    </span>
                </div>
                <div class="card-body" style="padding:0;">
                    <div class="table-wrap" id="tableWrap">
                        <div class="empty-state">
                            <div class="big-icon"><i class="fas fa-map-pin"></i></div>
                            <p>Nenhuma busca realizada.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- DIVISOR (RESIZER) -->
        <div class="resizer" id="resizer"></div>

        <!-- MAPA -->
        <div class="right-panel">
            <div id="map"></div>
        </div>

    </div>

</div>

<!-- ============================================================ -->
<script>
    (function() {
        'use strict';

        // ----- GLOBALS -----

        // ----- RESIZER LOGIC -----
        let isResizing = false;

        function initResizer() {
            if (!resizer || !leftPanel) return;

            const onMove = (e) => {
                if (!isResizing) return;
                const containerRect = leftPanel.parentElement.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                if (!clientX) return;
                let newWidth = clientX - containerRect.left - 6;
                const minWidth = 300;
                const maxWidth = containerRect.width - 200;
                newWidth = Math.min(Math.max(newWidth, minWidth), maxWidth);
                leftPanel.style.flex = '0 0 ' + newWidth + 'px';
                if (map) {
                    setTimeout(() => map.invalidateSize(), 50);
                }
            };

            const onStart = (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                resizer.classList.add('active');
                e.preventDefault();
            };

            const onEnd = () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    resizer.classList.remove('active');
                    if (map) {
                        setTimeout(() => map.invalidateSize(), 50);
                    }
                }
            };

            resizer.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            resizer.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        // ----- FUNÇÕES AUXILIARES -----
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatDist(km) {
            if (km === undefined || km === null || isNaN(km)) return '—';
            if (km < 1) return (km * 1000).toFixed(0) + ' m';
            return km.toFixed(2) + ' km';
        }

        function getOperatorColor(op) {
            const o = (op || '').toLowerCase().trim();
            if (o.includes('tim')) return '#0066b3';
            if (o.includes('vivo')) return '#7b1fa2';
            if (o.includes('claro')) return '#e8720a';
            if (o.includes('oi')) return '#1f8b4a';
            return '#5f7a92';
        }

        function getOperatorClass(op) {
            const o = (op || '').toLowerCase().trim();
            if (o.includes('tim')) return 'tim';
            if (o.includes('vivo')) return 'vivo';
            if (o.includes('claro')) return 'claro';
            if (o.includes('oi')) return 'oi';
            return '';
        }

        // ----- PARSE EXCEL -----
        function parseExcelData(data) {
            const rows = [];
            const header = data[0];
            const idx = (name) => {
                const n = name.toLowerCase().trim();
                for (let i = 0; i < header.length; i++) {
                    const h = String(header[i] || '').toLowerCase().trim();
                    if (h === n) return i;
                }
                return -1;
            };
            const iEstacao = idx('número estação');
            const iOperadora = idx('operadora');
            const iUf = idx('siglauf');
            const iMun = idx('mun');
            const iBairro = idx('bairro');
            const iLogr = idx('logradouro');
            const iLat = idx('latitude');
            const iLng = idx('longitude');
            const iIbge = idx('ibge');
            const iInfra = idx('classinfrafisica');
            const iTecs = idx('tecs');
            const iFaixa = idx('faixa');

            for (let r = 1; r < data.length; r++) {
                const row = data[r];
                if (!row || row.length === 0) continue;
                const lat = parseFloat(row[iLat]);
                const lng = parseFloat(row[iLng]);
                if (isNaN(lat) || isNaN(lng)) continue;
                rows.push({
                    id: `ant-${r}`,
                    estacao: String(row[iEstacao] || '').trim(),
                    operadora: String(row[iOperadora] || '').trim(),
                    uf: String(row[iUf] || '').trim(),
                    mun: String(row[iMun] || '').trim(),
                    bairro: String(row[iBairro] || '').trim(),
                    logradouro: String(row[iLogr] || '').trim(),
                    latitude: lat,
                    longitude: lng,
                    ibge: String(row[iIbge] || '').trim(),
                    infra: String(row[iInfra] || '').trim(),
                    tecs: String(row[iTecs] || '').trim(),
                    faixa: String(row[iFaixa] || '').trim(),
                });
            }
            return rows;
        }

        // ----- LOAD XLSX -----
        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    if (!json || json.length < 2) {
                        alert('Arquivo vazio ou formato inválido.');
                        return;
                    }
                    allAntennas = parseExcelData(json);
                    if (totalAntenasSpan) totalAntenasSpan.textContent = allAntennas.length;
                    if (fileInfo) {
                        fileInfo.textContent = `✅ ${allAntennas.length} antenas`;
                        fileInfo.style.color = '#4aae7a';
                    }
                    extrairOpcoesFiltro();
                    renderizarFiltros();
                    updateMapMarkers();
                    clearResults();
                    if (allAntennas.length > 0) {
                        const bounds = L.latLngBounds(allAntennas.map(a => [a.latitude, a.longitude]));
                        if (map && bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
                    }
                    atualizarIndicadores(allAntennas);
                } catch (err) {
                    alert('Erro ao ler o arquivo: ' + err.message);
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ----- EXTRAIR OPÇÕES PARA FILTROS -----
        function extrairOpcoesFiltro() {
            const ops = new Set();
            const tecs = new Set();
            allAntennas.forEach(a => {
                if (a.operadora) ops.add(a.operadora.trim());
                (a.tecs || '').split(/\s+/).forEach(t => { if (t) tecs.add(t.trim()); });
            });
            todosOperadoras = Array.from(ops).sort();
            todasTecnologias = Array.from(tecs).sort();
            filtrosOperadoras = new Set(todosOperadoras);
            filtrosTecnologias = new Set(todasTecnologias);
        }

        // ----- RENDERIZAR FILTROS -----
        function renderizarFiltros() {
            let htmlOps = '';
            todosOperadoras.forEach(op => {
                const checked = filtrosOperadoras.has(op) ? 'checked' : '';
                htmlOps += `<label class="${checked ? 'checked' : ''}">
                    <input type="checkbox" value="${op}" ${checked} /> ${op}
                </label>`;
            });
            opcoesOperadoras.innerHTML = htmlOps;

            let htmlTecs = '';
            todasTecnologias.forEach(tec => {
                const checked = filtrosTecnologias.has(tec) ? 'checked' : '';
                htmlTecs += `<label class="${checked ? 'checked' : ''}">
                    <input type="checkbox" value="${tec}" ${checked} /> ${tec}
                </label>`;
            });
            opcoesTecnologias.innerHTML = htmlTecs;

            atualizarContagemFiltros();

            opcoesOperadoras.querySelectorAll('label').forEach(label => {
                const cb = label.querySelector('input[type="checkbox"]');
                cb.addEventListener('change', function() {
                    label.classList.toggle('checked', this.checked);
                });
            });
            opcoesTecnologias.querySelectorAll('label').forEach(label => {
                const cb = label.querySelector('input[type="checkbox"]');
                cb.addEventListener('change', function() {
                    label.classList.toggle('checked', this.checked);
                });
            });
        }

        function atualizarContagemFiltros() {
            const total = filtrosOperadoras.size + filtrosTecnologias.size;
            if (filtroCount) filtroCount.textContent = total + ' ativos';
        }

        // ----- APLICAR FILTROS -----
        function aplicarFiltros() {
            const opsSelecionadas = [];
            opcoesOperadoras.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                opsSelecionadas.push(cb.value);
            });
            const tecsSelecionadas = [];
            opcoesTecnologias.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                tecsSelecionadas.push(cb.value);
            });
            filtrosOperadoras = new Set(opsSelecionadas);
            filtrosTecnologias = new Set(tecsSelecionadas);
            atualizarContagemFiltros();

            if (allSearchResults.length > 0 && activePointIndex < allSearchResults.length) {
                const item = allSearchResults[activePointIndex];
                const resultsFiltrados = aplicarFiltrosEmArray(item.results);
                renderTable(resultsFiltrados, item.point);
                atualizarIndicadores(resultsFiltrados);
                updateMapForPoint(item.point, item.results, parseFloat(radiusSlider.value));
            } else if (allAntennas.length > 0) {
                const filtrados = aplicarFiltrosEmArray(allAntennas);
                atualizarIndicadores(filtrados);
            }
        }

        function aplicarFiltrosEmArray(results) {
            return results.filter(a => {
                const opOk = filtrosOperadoras.size === 0 || filtrosOperadoras.has(a.operadora);
                const tecOk = filtrosTecnologias.size === 0 || (a.tecs || '').split(/\s+/).some(t => filtrosTecnologias.has(t));
                return opOk && tecOk;
            });
        }

        // ----- CLIQUE DA ANTENA -----
        function handleAntennaClick(a, marker) {
            if (marker) marker.openPopup();
            if (!allSearchResults || allSearchResults.length === 0) return;

            const radius = parseFloat(radiusSlider.value);
            const matchingPoints = [];
            allSearchResults.forEach((item, idx) => {
                const dist = haversine(item.point.lat, item.point.lng, a.latitude, a.longitude);
                if (dist <= radius) matchingPoints.push({ idx, dist });
            });

            if (matchingPoints.length > 0) {
                matchingPoints.sort((x, y) => x.dist - y.dist);
                const targetIndex = matchingPoints[0].idx;
                if (targetIndex !== activePointIndex) {
                    activePointIndex = targetIndex;
                    showPointResults(targetIndex);
                } else {
                    setTimeout(() => {
                        highlightAntennaInTable(a.id);
                        if (marker) marker.openPopup();
                    }, 50);
                }
            }
        }

        // ----- UPDATE MAP MARKERS (all antennas) -----

            if (!markersLayer) return;
            markersLayer.clearLayers();

            allAntennas.forEach(a => {

        // ----- DESTACAR ANTENA NA TABELA -----

        // ----- GEOCODE (melhorado) -----
        async function geocodeAddress(address) {
            const url = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
                format: 'json',
                q: address + ', Brasil',
                limit: 10,
                addressdetails: 1,
                'accept-language': 'pt-BR',
                countrycodes: 'br',
                viewbox: '-73.9828,-33.7511,-34.7931,5.2718',
                bounded: 1
            });

            try {
                const response = await fetch(url, {
                    headers: { 'User-Agent': 'EstudoViabilidadeApp/1.0' }
                });
                const data = await response.json();
                if (!data || data.length === 0) return null;

                const priority = {
                    'house': 1,
                    'building': 2,
                    'amenity': 3,
                    'shop': 4,
                    'tourism': 5,
                    'place': 6,
                    'road': 7,
                    'city': 8
                };
                let best = data[0];
                let bestScore = 99;
                for (const item of data) {
                    const type = (item.type || '').toLowerCase();
                    const cls = (item.class || '').toLowerCase();
                    let score = priority[type] || priority[cls] || 10;
                    if (item.osm_type === 'node') score -= 0.5;
                    if (score < bestScore) {
                        bestScore = score;
                        best = item;
                    }
                }
                const lat = parseFloat(best.lat);
                const lng = parseFloat(best.lon);
                const label = best.display_name || address;
                const isApprox = (best.type === 'road' || best.class === 'highway' || best.type === 'city' || best.class === 'place') || bestScore >= 5;
                return { lat, lng, label, isApproximate: isApprox };
            } catch (err) {
                console.error('Erro na geocodificação:', err);
                return null;
            }
        }

        // ----- SEARCH -----
        async function performSearch() {
            if (allAntennas.length === 0) {
                alert('Carregue a base de antenas primeiro.');
                return;
            }

            const radius = parseFloat(radiusSlider.value);
            const addressLines = addressInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const coordLines = coordInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            const entries = [];
            for (const line of addressLines) {
                entries.push({ type: 'address', text: line });
            }
            for (const line of coordLines) {
                const parts = line.split(/[,;\s]+/).filter(p => p.length > 0);
                if (parts.length >= 2) {
                    const lat = parseFloat(parts[0].replace(',', '.'));
                    const lng = parseFloat(parts[1].replace(',', '.'));
                    if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                        entries.push({ type: 'coord', text: line, lat, lng });
                    } else {
                        entries.push({ type: 'address', text: line });
                    }
                } else {
                    entries.push({ type: 'address', text: line });
                }
            }

            if (entries.length === 0) {
                alert('Digite pelo menos um endereço ou coordenada.');
                return;
            }

            const allResults = [];
            for (const entry of entries) {
                let lat, lng, label, isApprox = false;
                let rawText = entry.text;
                if (entry.type === 'coord') {
                    lat = entry.lat;
                    lng = entry.lng;
                    label = `📍 ${entry.lat.toFixed(5)}, ${entry.lng.toFixed(5)}`;
                    isApprox = false;
                } else {
                    const geo = await geocodeAddress(entry.text);
                    if (!geo) {
                        console.warn('Falha ao geocodificar:', entry.text);
                        continue;
                    }
                    lat = geo.lat;
                    lng = geo.lng;
                    label = geo.label;
                    isApprox = geo.isApproximate || false;
                }

                const results = allAntennas.map(a => {
                    const dist = haversine(lat, lng, a.latitude, a.longitude);
                    return { ...a, distKm: dist };
                }).filter(a => a.distKm <= radius)
                .sort((a, b) => a.distKm - b.distKm);

                allResults.push({
                    point: { lat, lng, label, raw: rawText, isApproximate: isApprox },
                    results: results
                });
            }

            if (allResults.length === 0) {
                alert('Nenhum ponto pôde ser geocodificado.');
                return;
            }

            allSearchResults = allResults;
            activePointIndex = 0;

            showAllSearchPoints(allResults);
            showPointResults(0);
            renderPontosLista(allResults);

            if (allResults.length > 0) {
                const bounds = L.latLngBounds(allResults.map(p => [p.point.lat, p.point.lng]));
                if (allAntennas.length > 0) bounds.extend(allAntennas.map(a => [a.latitude, a.longitude]));
                if (map && bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
            }

            if (resultCount) resultCount.textContent = allResults[activePointIndex].results.length + ' antenas';
            if (qtdPontos) qtdPontos.textContent = allResults.length;
        }

        // ----- MOSTRA TODOS OS PONTOS NO MAPA -----
        function showAllSearchPoints(allResults) {
            if (!searchMarkersLayer) return;
            searchMarkersLayer.clearLayers();

            allResults.forEach((item, idx) => {
                const p = item.point;
                const isActive = (idx === activePointIndex);
                const color = isActive ? '#e74c3c' : '#2c7fb8';
                const iconHtml = `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px ${color};position:relative;">
                    ${p.isApproximate ? '<span style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#fff;font-size:7px;padding:0 4px;border-radius:8px;white-space:nowrap;">aprox.</span>' : ''}
                </div>`;
                const icon = L.divIcon({
                    html: iconHtml,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9],
                    className: 'search-marker'
                });
                const marker = L.marker([p.lat, p.lng], { icon })
                    .bindPopup(`<strong>📍 ${p.label}</strong><br>${p.isApproximate ? '⚠️ Localização aproximada' : ''}`)
                    .on('click', function() {
                        activePointIndex = idx;
                        showPointResults(idx);
                        renderPontosLista(allSearchResults);
                        showAllSearchPoints(allSearchResults);
                    });
                searchMarkersLayer.addLayer(marker);
            });
        }

        // ----- EXIBE RESULTADOS DE UM PONTO -----
        function showPointResults(index) {
            if (index < 0 || index >= allSearchResults.length) return;
            const item = allSearchResults[index];
            const point = item.point;
            const results = item.results;
            const radius = parseFloat(radiusSlider.value);

            currentSearchPoint = point;
            currentResults = results;

            updateMapForPoint(point, results, radius);
            const resultsFiltrados = aplicarFiltrosEmArray(results);
            renderTable(resultsFiltrados, point);
            atualizarIndicadores(resultsFiltrados);

            const ops = new Set(resultsFiltrados.map(a => a.operadora));
            const tecs = new Set();
            resultsFiltrados.forEach(a => {
                (a.tecs || '').split(/\s+/).forEach(t => { if (t) tecs.add(t); });
            });
            if (resultCount) resultCount.textContent = resultsFiltrados.length + ' antenas';

            renderPontosLista(allSearchResults);
            showAllSearchPoints(allSearchResults);
            highlightedRowId = null;
        }

        // ----- ATUALIZA MAPA PARA UM PONTO -----
        function updateMapForPoint(point, results, radius) {
            if (!map) initMap();
            if (radiusCircle) { map.removeLayer(radiusCircle);
                radiusCircle = null; }
            if (!markersLayer) return;

            markersLayer.clearLayers();
            const resultsFiltrados = aplicarFiltrosEmArray(results);
            const idsFiltrados = new Set(resultsFiltrados.map(a => a.id));

            allAntennas.forEach(a => {
                const dist = haversine(point.lat, point.lng, a.latitude, a.longitude);
                const inRadius = dist <= radius;
                const estaNosFiltrados = idsFiltrados.has(a.id);
                const color = getOperatorColor(a.operadora);
                const popup = `<strong>${a.operadora}</strong><br>${a.logradouro}<br>${a.mun} - ${a.uf}<br>
                               📏 ${formatDist(dist)}<br>📡 ${a.tecs || '—'} &nbsp;|&nbsp; ${a.faixa || '—'}`;
                const marker = L.circleMarker([a.latitude, a.longitude], {
                    radius: (inRadius && estaNosFiltrados) ? 7 : (inRadius ? 5 : 3),
                    fillColor: color,
                    color: (inRadius && estaNosFiltrados) ? '#fff' : '#ccc',
                    weight: (inRadius && estaNosFiltrados) ? 2 : 1,
                    opacity: 1,
                    fillOpacity: (inRadius && estaNosFiltrados) ? 0.9 : 0.5,
                    bubblingMouseEvents: false
                }).bindPopup(popup, { autoPan: true });
                marker.on('click', function(e) {
                    if (e && L.DomEvent) L.DomEvent.stopPropagation(e);
                    handleAntennaClick(a, marker);
                });
                markersLayer.addLayer(marker);
            });

            radiusCircle = L.circle([point.lat, point.lng], {
                radius: radius * 1000,
                color: '#4a8fc4',
                weight: 2,
                opacity: 0.5,
                fillColor: '#4a8fc4',
                fillOpacity: 0.08,
                interactive: false
            }).addTo(map);
        }

        // ----- RENDER TABLE -----
        function renderTable(results, point) {
            if (!tableWrap) return;
            if (results.length === 0) {
                tableWrap.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon"><i class="fas fa-tower-broadcast"></i></div>
                        <p>Nenhuma antena no raio com os filtros atuais.</p>
                    </div>
                `;
                return;
            }
            let html = `<table>
                <thead><tr>
                    <th>#</th><th>Operadora</th><th>Localização</th><th>Distância</th><th>Tecnologias</th><th>Faixa</th><th>Infra</th>
                </tr></thead><tbody>`;
            results.forEach((a, i) => {
                const distStr = formatDist(a.distKm);
                const distClass = a.distKm < 2 ? 'near' : (a.distKm < 5 ? '' : 'far');
                const opClass = getOperatorClass(a.operadora);
                const tecs = (a.tecs || '').split(/\s+/).filter(t => t);
                const faixas = (a.faixa || '').split(/\s+/).filter(f => f);
                html += `<tr data-antenna-id="${a.id}">
                    <td>${i+1}</td>
                    <td><span class="tag tag-operator ${opClass}">${a.operadora || '—'}</span></td>
                    <td>${a.logradouro || '—'}<br><small>${a.mun || ''} - ${a.uf || ''}</small></td>
                    <td><span class="dist-badge ${distClass}">${distStr}</span></td>
                    <td>${tecs.map(t => `<span class="tag tag-tech">${t}</span>`).join(' ') || '—'}</td>
                    <td>${faixas.map(f => `<span class="tag">${f}</span>`).join(' ') || '—'}</td>
                    <td>${a.infra || '—'}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            tableWrap.innerHTML = html;
            highlightedRowId = null;
        }

        // ----- ATUALIZAR INDICADORES -----
        function atualizarIndicadores(results) {
            if (!results) results = [];
            if (indTotal) indTotal.textContent = results.length;

            const ops = new Set(results.map(a => a.operadora));
            if (indOps) indOps.textContent = ops.size;

            const tecs = new Set();
            results.forEach(a => {
                (a.tecs || '').split(/\s+/).forEach(t => { if (t) tecs.add(t); });
            });
            if (indTecnologias) indTecnologias.textContent = tecs.size;

            if (results.length > 0) {
                const maisProx = results.reduce((min, a) => a.distKm < min.distKm ? a : min);
                if (indMaisProx) indMaisProx.textContent = formatDist(maisProx.distKm);
            } else {
                if (indMaisProx) indMaisProx.textContent = '-';
            }

            let detalhesHtml = '';
            const contagemOps = {};
            results.forEach(a => {
                contagemOps[a.operadora] = (contagemOps[a.operadora] || 0) + 1;
            });
            Object.keys(contagemOps).sort().forEach(op => {
                detalhesHtml += `<span><strong>${op}</strong> ${contagemOps[op]}</span>`;
            });
            if (indicadoresDetalhes) indicadoresDetalhes.innerHTML = detalhesHtml;
        }

        // ----- RENDER LISTA DE PONTOS (com filtro) -----
        function renderPontosLista(allResults) {
            if (!pontosLista) return;
            if (!allResults || allResults.length === 0) {
                pontosLista.innerHTML = '';
                if (qtdPontos) qtdPontos.textContent = '0';
                return;
            }

            const termo = filtroPontosTermo.toLowerCase().trim();
            let resultadosFiltrados = allResults;
            if (termo) {
                resultadosFiltrados = allResults.filter(item => {
                    const label = (item.point.raw || item.point.label || '').toLowerCase();
                    return label.includes(termo);
                });
            }

            if (qtdPontos) qtdPontos.textContent = allResults.length;

            if (resultadosFiltrados.length === 0) {
                pontosLista.innerHTML = `<div style="font-size:12px; color:#5a6a7a; padding:4px;">Nenhum ponto corresponde ao filtro.</div>`;
                return;
            }

            let html = '';
            resultadosFiltrados.forEach((item, idx) => {
                const realIndex = allResults.indexOf(item);
                const label = item.point.raw || item.point.label;
                const active = (realIndex === activePointIndex) ? 'active' : '';
                const aprox = item.point.isApproximate ? '<span class="badge-aprox">aprox.</span>' : '';
                html += `<div class="ponto-item ${active}" data-index="${realIndex}" title="${label}">${realIndex+1}. ${label} ${aprox}</div>`;
            });
            pontosLista.innerHTML = html;

            pontosLista.querySelectorAll('.ponto-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx) && idx !== activePointIndex) {
                        activePointIndex = idx;
                        showPointResults(idx);
                        renderPontosLista(allSearchResults);
                        showAllSearchPoints(allSearchResults);
                        const p = allSearchResults[idx].point;
                        if (map) map.flyTo([p.lat, p.lng], 14);
                    }
                });
            });
        }

        // ----- CLEAR RESULTS -----
        function clearResults() {
            currentResults = [];
            currentSearchPoint = null;
            allSearchResults = [];
            activePointIndex = 0;
            filtroPontosTermo = '';
            if (filtroPontosInput) filtroPontosInput.value = '';
            if (searchMarkersLayer) searchMarkersLayer.clearLayers();
            if (radiusCircle && map) { map.removeLayer(radiusCircle);
                radiusCircle = null; }
            if (markersLayer) { markersLayer.clearLayers();
                updateMapMarkers(); }
            if (tableWrap) {
                tableWrap.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon"><i class="fas fa-map-pin"></i></div>
                        <p>Nenhuma busca realizada.</p>
                    </div>
                `;
            }
            if (resultCount) resultCount.textContent = '0';
            if (pontosLista) pontosLista.innerHTML = '';
            if (qtdPontos) qtdPontos.textContent = '0';
            if (addressInput) addressInput.value = '';
            if (coordInput) coordInput.value = '';
            if (importStatus) importStatus.textContent = '';
            highlightedRowId = null;
            if (allAntennas.length > 0) {
                atualizarIndicadores(allAntennas);
                const bounds = L.latLngBounds(allAntennas.map(a => [a.latitude, a.longitude]));
                if (map && bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
            } else {
                atualizarIndicadores([]);
            }
        }

        // ----- EXPORT CSV -----
        function exportCsv() {
            if (allSearchResults.length === 0) {
                alert('Faça uma busca primeiro para exportar os dados.');
                return;
            }
            let csvRows = ['LOCAL;VIABILIDADE;OPERADORA MÓVEL'];
            for (const item of allSearchResults) {
                const pointLabel = item.point.raw || item.point.label || 'Coordenada';
                const resultsFiltrados = aplicarFiltrosEmArray(item.results);
                const tecsSet = new Set();
                resultsFiltrados.forEach(a => {
                    (a.tecs || '').split(/\s+/).forEach(t => { if (t) tecsSet.add(t); });
                });
                const viabilidade = tecsSet.size > 0 ? [...tecsSet].sort().join(' ') : 'Sem viabilidade';
                const opsSet = new Set(resultsFiltrados.map(a => a.operadora));
                const operadoras = [...opsSet].sort().join(' ');
                const labelEsc = pointLabel.replace(/;/g, ',');
                csvRows.push(`${labelEsc};${viabilidade};${operadoras}`);
            }
            const csvContent = csvRows.join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `viabilidade_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ----- IMPORTAR LISTA -----
        function importList(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const lines = content.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
                    if (lines.length === 0) {
                        alert('Arquivo vazio.');
                        return;
                    }
                    const addresses = [];
                    const coords = [];
                    for (const line of lines) {
                        const parts = line.split(/[,;\s]+/).filter(p => p.length > 0);
                        if (parts.length >= 2) {
                            const lat = parseFloat(parts[0].replace(',', '.'));
                            const lng = parseFloat(parts[1].replace(',', '.'));
                            if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                                coords.push(line);
                                continue;
                            }
                        }
                        addresses.push(line);
                    }
                    if (addresses.length > 0 && addressInput) addressInput.value = addresses.join('\n');
                    if (coords.length > 0 && coordInput) coordInput.value = coords.join('\n');
                    if (importStatus) {
                        importStatus.textContent = `✅ ${lines.length} itens importados`;
                        importStatus.style.color = '#4aae7a';
                    }
                } catch (err) {
                    alert('Erro ao processar o arquivo: ' + err.message);
                    console.error(err);
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // ----- INIT MAP -----
        function initMap() {
            if (map) return;
            if (!mapDiv) return;
            map = L.map(mapDiv, { zoomControl: true }).setView([-15.8, -47.9], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19,
            }).addTo(map);
            if (markersLayer) markersLayer.addTo(map);
            if (searchMarkersLayer) searchMarkersLayer.addTo(map);
            setTimeout(() => map.invalidateSize(), 200);
        }

        // ----- EVENTOS -----
        if (uploadZone && fileInput) {
            uploadZone.addEventListener('click', () => fileInput.click());
            uploadZone.addEventListener('dragover', (e) => { e.preventDefault();
                uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.match(/\.xlsx?$/i)) loadFile(file);
                    else alert('Por favor, envie um arquivo Excel (.xlsx ou .xls).');
                }
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) loadFile(e.target.files[0]);
                e.target.value = '';
            });
        }

        if (importFileInput && importLabel) {
            importLabel.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) importList(e.target.files[0]);
                e.target.value = '';
            });
        }

        if (radiusSlider && radiusLabel) {
            radiusSlider.addEventListener('input', () => {
                radiusLabel.textContent = radiusSlider.value + ' km';
            });
        }

        if (searchBtn) searchBtn.addEventListener('click', performSearch);
        if (clearBtn) clearBtn.addEventListener('click', clearResults);
        if (exportCsvBtn) exportCsvBtn.addEventListener('click', exportCsv);

        if (limparFiltrosBtn) {
            limparFiltrosBtn.addEventListener('click', function() {
                opcoesOperadoras.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.closest('label').classList.remove('checked');
                });
                opcoesTecnologias.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.closest('label').classList.remove('checked');
                });
                filtrosOperadoras = new Set();
                filtrosTecnologias = new Set();
                atualizarContagemFiltros();
                aplicarFiltros();
            });
        }

        if (aplicarFiltrosBtn) aplicarFiltrosBtn.addEventListener('click', aplicarFiltros);

        if (filtroPontosInput) {
            filtroPontosInput.addEventListener('input', function() {
                filtroPontosTermo = this.value;
                renderPontosLista(allSearchResults);
            });
        }

        document.querySelectorAll('textarea').forEach(ta => {
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    if (searchBtn) searchBtn.click();
                }
            });
        });

        // ----- INIT -----
        initMap();
        initResizer();
        if (totalAntenasSpan) totalAntenasSpan.textContent = '0';
        if (qtdPontos) qtdPontos.textContent = '0';
        atualizarIndicadores([]);
    })();
</script>

</body>
</html>
